name: Privacy checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  privacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install "semgrep==1.100.0"
      - name: Sensitive-field logging and Debug leaks
        run: semgrep scan --metrics=off --error --config .semgrep/privacy.yml
      - name: Retention commitment check
        run: python3 tools/check_retention.py
