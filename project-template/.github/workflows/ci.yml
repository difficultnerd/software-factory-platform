name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * 1" # weekly, picks up new advisories without a code change

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: "8.24.2"
  SEMGREP_VERSION: "1.100.0"

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Install gitleaks
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz gitleaks
      - name: Scan history
        run: ./gitleaks git --config .gitleaks.toml --redact --verbose

  rust:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "rustfmt, clippy" }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: backend }
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  rust-supply-chain:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with: { tool: "cargo-audit,cargo-deny" }
      - run: cargo audit
      - run: cargo deny check

  dart:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: dart analyze --fatal-infos
      - run: flutter test
      - name: Licence check
        working-directory: .
        run: python3 tools/check_dart_licenses.py frontend

  semgrep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install "semgrep==${SEMGREP_VERSION}"
      - run: semgrep scan --metrics=off --error --config p/default --config p/security-audit --config .semgrep/

  python-scope:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check_python_scope.py

  # Single required status check for branch protection. Add jobs to `needs` as layers are enabled.
  ci-gate:
    if: always()
    needs: [gitleaks, rust, rust-supply-chain, dart, semgrep, python-scope]
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless every job succeeded
        run: |
          echo '${{ toJSON(needs) }}' | python3 -c "import json,sys; r=json.load(sys.stdin); bad={k:v['result'] for k,v in r.items() if v['result']!='success'}; print(bad or 'all green'); sys.exit(1 if bad else 0)"
